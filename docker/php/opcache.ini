[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.max_accelerated_files=20000
; Disabled: with the project bind-mounted from Windows, stat()-ing every
; vendor file on each request to check for changes was nearly as slow as
; not caching at all. Restart the app container after editing PHP files
; that must take effect immediately (or re-enable this for daily dev use).
opcache.validate_timestamps=0
