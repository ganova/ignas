server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Docker's embedded DNS (127.0.0.11) re-resolves "app" on every
        # request instead of once at nginx startup — without this, restarting
        # the app container (which gets a new IP) leaves nginx pointing at a
        # dead address until nginx itself is also restarted.
        resolver 127.0.0.11 valid=10s;
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 50m;
}
