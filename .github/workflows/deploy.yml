name: Deploy to cPanel

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend assets
        run: npm run build

      - name: Prepare deployment package
        shell: bash
        run: |
          mkdir -p deploy-package
          rsync -a --exclude='.git' --exclude='.github' --exclude='.env' \
            --exclude='deploy-package' \
            --exclude='node_modules' --exclude='tests' --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' ./ deploy-package/
          touch deploy-package/.deploy-ready

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./deploy-package/
          protocol: ftp
          port: 21
          exclude: |
            **/.git*/**
            **/.github/**
            **/.env
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
