name: ignas

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ignas-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
    depends_on:
      - db
      - redis
    networks: [ignas]

  web:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks: [ignas]

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/var/www/html
      # node_modules lives in its own volume, not the Windows bind mount:
      # esbuild/vite touch thousands of small files and a bind-mounted
      # node_modules made builds hang for minutes in disk-wait.
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    networks: [ignas]

  queue:
    image: ignas-app
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
      - db
    networks: [ignas]

  ssr:
    image: ignas-app
    working_dir: /var/www/html
    command: php artisan inertia:start-ssr
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks: [ignas]

  scheduler:
    image: ignas-app
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks: [ignas]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ignas
      POSTGRES_USER: ignas
      POSTGRES_PASSWORD: ignas
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [ignas]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [ignas]

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [ignas]

networks:
  ignas:

volumes:
  db-data:
  node_modules:
