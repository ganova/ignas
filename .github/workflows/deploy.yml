name: Deploy to cPanel

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend assets
        run: npm run build

      - name: Prepare deployment package
        shell: bash
        run: |
          mkdir -p deploy-package
          rsync -a --exclude='.git' --exclude='.github' --exclude='.env' \
            --exclude='deploy-package' \
            --exclude='node_modules' --exclude='tests' --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' ./ deploy-package/
          touch deploy-package/.deploy-ready

      - name: Upload Laravel application via FTP
        # Keep the control connection on plain FTP; this host accepts port 21.
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./deploy-package/
          protocol: ftp
          port: 21
          exclude: |
            **/.git*/**
            **/.github/**
            **/.env
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**

      - name: Upload public web root via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./deploy-package/public/
          protocol: ftp
          port: 21
          state-name: .ftp-deploy-public-state.json

      - name: Verify production entry points
        shell: bash
        run: |
          set -euo pipefail
          for url in "https://ignatiusraditya.site/?deploy-check=${GITHUB_SHA}" "https://ignatiusraditya.site/portfolio?deploy-check=${GITHUB_SHA}"; do
            body="$(curl --fail --silent --show-error --location --max-time 30 "$url")"
            if ! grep -q "Ignas\|ignas" <<< "$body"; then
              echo "Deploy check failed for $url: expected application content was not found."
              exit 1
            fi
          done
